name=QuackPack-DuckSleep
version=0.1.0
author=OWL Integrations
maintainer=OWL Integrations <support@owlintegrations.com>
sentence=Opt-in scheduled deep sleep and battery survival hold for ClusterDuck Protocol MamaDucks.
paragraph=A pure, host-tested sleep policy (daily UTC window, relay guard, per-device wake jitter, chunked sleeps, battery survival hold) with an ESP32 adapter that re-sleeps silently after early timer wakes. Everything CDP-specific comes in through callbacks, and with the build defines left at 0 the library compiles away. An optional AXP2101 helper (T-Beam v1.2) cuts and restores rails and reads the cell; it needs XPowersLib in the sketch.
category=Device Control
url=https://github.com/Project-Owl/QuackPack-DuckSleep
architectures=esp32
depends=ArduinoJson
includes=DuckSleep.h
