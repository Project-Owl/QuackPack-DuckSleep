; Builds examples/BasicSleep against this library, the way a DMS or CDP
; MamaDuck project would pull it in.
;
;   pio run -e example_off   DuckSleep compiled away (the default)
;   pio run -e example_on    22:00-06:00 UTC window, relay, survival hold on
;
; Host tests for the policy: tests/host/run.sh

[platformio]
description = QuackPack-DuckSleep example
src_dir = examples/BasicSleep
default_envs = example_off

[env]
platform = espressif32@7.0.1
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
	symlink://./
	lewisxhe/XPowersLib@^0.3.0
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++2a

[env:example_off]

[env:example_on]
build_flags =
	${env.build_flags}
	-DDUCK_SLEEP_ENABLED=1
	-DDUCK_SLEEP_START_MIN_UTC=1320
	-DDUCK_SLEEP_WAKE_MIN_UTC=360
	-DDUCK_SURVIVAL_ENABLED=1
	-DDUCK_BUILD_EPOCH=1793750400
